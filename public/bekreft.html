<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bekreft påmelding – Kulturvarsling</title>
  <link rel="stylesheet" href="/papir.css">
</head>
<body>
  <article class="ark smal">
    <p class="versal">Nyhetsbrev</p>
    <h1>Bekreft påmeldingen</h1>
    <p>Ingenting er endret før du trykker på knappen. Etterpå sender vi nyhetsbrevet til adressen som ba om det.</p>
    <button type="button" id="knapp">Bekreft påmeldingen</button>
    <p id="status" class="status" role="status">Ingenting er endret.</p>
    <p class="bunn"><a href="/personvern">Personvernerklæring</a></p>
  </article>
  <script>
    const token = new URLSearchParams(location.search).get("t");
    const knapp = document.getElementById("knapp");
    const status = document.getElementById("status");
    if (!token) {
      knapp.hidden = true;
      status.dataset.tilstand = "feil";
      status.textContent = "Lenken mangler et gyldig token. Ingenting er endret.";
    } else {
      knapp.addEventListener("click", send);
    }
    async function send() {
      knapp.disabled = true;
      status.dataset.tilstand = "venter";
      status.textContent = "Lagrer …";
      try {
        const res = await fetch("https://zyyijlvmgoanjdzngmon.supabase.co/functions/v1/meld-pa", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ handling: "bekreft", token })
        });
        const data = await res.json().catch(() => null);
        if (res.ok && data && data.ok === true) {
          status.dataset.tilstand = "ok";
          status.textContent = data.melding;
          knapp.hidden = true;
        } else {
          status.dataset.tilstand = "feil";
          status.textContent = (data && data.feil) || "Lagringen feilet. Ingenting er endret.";
          knapp.disabled = false;
        }
      } catch (e) {
        status.dataset.tilstand = "feil";
        status.textContent = "Fikk ikke kontakt. Ingenting er endret.";
        knapp.disabled = false;
      }
    }
  </script>
</body>
</html>
