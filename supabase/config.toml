# Funksjonskonfigurasjon for samtykke og avmelding.
# Øvrige innstillinger bruker CLI-standarder.
#
# nyhetsbrev er en stubb som svarer 410, lik prod. En deploy skal holde
# funksjonen av. Den gamle utsendingen ligger i supabase/arkiv/nyhetsbrev.ts
# og er ikke en edge-funksjon.
#
# send-bekreftelser er manuell. Ikke legg den i pg_cron eller annen tidsplan,
# og ikke kall den før kulturvarsling.no er verifisert som avsender i Resend.
#
# stripe-webhook står her med verify_jwt = false fordi det allerede er slik
# funksjonen kjører i produksjon (Stripe har ingen Supabase-JWT).

project_id = "kulturvarsling"

[functions.avmeld]
verify_jwt = false

[functions.meld-pa]
verify_jwt = false

[functions.slett-konto]
verify_jwt = true

[functions.nyhetsbrev]
verify_jwt = true

[functions.send-bekreftelser]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.horingshjelp]
verify_jwt = true

# Signering og lenker i e-post har ingen brukersesjon, som meld-pa.
[functions.signer-innspill]
verify_jwt = false

# Krever i tillegg x-cron-secret. Ikke planlagt i cron.
[functions.slett-signaturer]
verify_jwt = true

[functions.mine-innspill]
verify_jwt = true
