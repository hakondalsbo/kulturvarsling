name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bygg:
    name: Vite-bygg og tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - run: npm test

  deno:
    name: Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check
        run: |
          deno check --node-modules-dir=auto \
            supabase/functions/hent-saker/index.ts \
            supabase/functions/klartekst/index.ts \
            supabase/functions/budsjett/index.ts \
            supabase/functions/nyhetsbrev/index.ts \
            supabase/functions/stripe-checkout/index.ts \
            supabase/functions/stripe-webhook/index.ts \
            supabase/functions/backfill-geografi/index.ts
      - name: deno test
        run: deno test --node-modules-dir=auto --allow-env supabase/functions

  tsc:
    name: tsc-baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/tsc-baseline.mjs
